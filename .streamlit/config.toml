[theme]
base = "light"
primaryColor = "#0E7C4A"
backgroundColor = "#F5F7F6"
secondaryBackgroundColor = "#F2F5F3"
textColor = "#13201A"
linkColor = "#0E7C4A"
borderColor = "#D9E2DC"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter"
greenColor = "#0E7C4A"
greenBackgroundColor = "#E7F3EC"

[client]
toolbarMode = "minimal"
